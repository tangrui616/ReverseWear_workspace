<!doctype html>
<html lang="zh-CN" data-suite-page="launcher">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>命令面板</title>
  <link rel="stylesheet" href="suite.css">
  <script type="module" src="suite.mjs"></script>
</head>
<body class="launcher-body">
  <main class="launcher-shell">
    <label class="launcher-search"><span aria-hidden="true">⌕</span><input id="launcher-search" type="search" autocomplete="off" placeholder="搜索命令、计算或片段…" aria-label="搜索命令与片段"><kbd>输入以搜索</kbd></label>
    <section id="launcher-results" class="launcher-results" role="listbox" aria-label="命令与片段"></section>
    <footer><span>↑ ↓ 选择</span><span>Enter 执行</span><kbd>Esc 关闭</kbd></footer>
    <div id="suite-toast" class="suite-toast" role="status"></div>
  </main>
</body>
</html>
